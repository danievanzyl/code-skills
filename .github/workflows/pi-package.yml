name: pi-package

on:
  pull_request:
    paths:
      - "extensions/**"
      - "tests/subagents/**"
      - "package.json"
      - "LICENSE"
      - ".github/workflows/pi-package.yml"
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "tests/subagents/**"
      - "package.json"
      - "LICENSE"
      - ".github/workflows/pi-package.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install typecheck dependencies
        run: npm install --no-save --ignore-scripts typescript @types/node @earendil-works/pi-coding-agent

      - name: Typecheck Pi extensions
        run: >-
          npx tsc --noEmit --target ES2022 --module NodeNext
          --moduleResolution NodeNext --skipLibCheck --types node
          --allowImportingTsExtensions
          extensions/status-window/index.ts
          extensions/status-window/api.ts
          extensions/github-status-section.ts
          extensions/picture-status-bar.ts
          extensions/subagents/index.ts
          extensions/subagents/personas.ts

      - name: Subagent extension regression tests
        run: bun test tests/subagents/index.test.ts tests/subagents/personas.test.ts

      - name: Validate package contents
        run: |
          npm pack --dry-run --json > package-contents.json
          node -e 'const files = require("./package-contents.json")[0].files.map(({ path }) => path); if (!files.includes("extensions/subagents/agents/codebase-analyzer.md")) process.exit(1)'

      - name: Load package in Pi
        run: npx pi --approve --no-extensions -e . --list-models >/dev/null
